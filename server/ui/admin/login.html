<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { 
            background-color: #f8fafc; /* Light LMS background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 100% 100%, #e0e7ff 0%, transparent 50%), radial-gradient(circle at 0% 0%, #e0e7ff 0%, transparent 50%);
        }

        .login-container {
            display: flex;
            width: 1000px;
            max-width: 95%;
            background: white;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* --- Left Panel --- */
        .left-panel {
            width: 45%;
            padding: 40px 50px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #141046;
            margin-bottom: 60px;
        }
        .logo span {
            color: #f59e0b;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #f9fafb;
            color: #111827;
        }
        .input-group input:focus {
            border-color: #141046;
        }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper ion-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            cursor: pointer;
            font-size: 18px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .form-actions label {
            font-size: 12px;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .form-actions a {
            font-size: 12px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #4f5be8; /* LMS Primary Blue */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #3f4ac8;
        }

        /* --- Right Panel --- */
        .right-panel {
            width: 55%;
            background-color: #4f5be8; /* LMS Primary Blue */
            padding: 60px 50px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-text {
            font-size: 32px;
            font-weight: 300;
            line-height: 1.3;
            color: white;
            margin-bottom: 40px;
        }

        .mockup {
            background: #f3f4f6;
            border-radius: 8px 8px 0 0;
            height: 200px;
            width: 100%;
            position: relative;
            padding: 20px;
            display: flex;
            gap: 16px;
        }
        .mockup-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 24px;
            background: #e5e7eb;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.r { background: #ef4444; }
        .dot.y { background: #eab308; }
        .dot.g { background: #22c55e; }

        .mockup-sidebar {
            width: 25%;
            background: #e5e7eb;
            height: 100%;
            border-radius: 4px;
            margin-top: 16px;
        }
        .mockup-main {
            flex: 1;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mockup-block {
            background: #e5e7eb;
            height: 40px;
            border-radius: 4px;
        }
        
        .mockup-card {
            position: absolute;
            top: 60%;
            left: 20%;
            right: -20px;
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(79, 91, 232, 0.2);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar { width: 48px; height: 48px; background: #9ca3af; border-radius: 8px; }
        .info { flex: 1; }
        .info h4 { font-size: 14px; color: #111827; }
        .info p { font-size: 10px; color: #6b7280; }
        .card-btn { background: #4f5be8; color: white; border: none; padding: 6px 12px; font-size: 10px; border-radius: 4px; }

        .footer-links {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #e0e7ff;
        }

        #otpSection { display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="logo" style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 32px; height: 32px; background: #4f5be8; color: white; display: flex; justify-content: center; align-items: center; border-radius: 8px;">
                    <ion-icon name="school"></ion-icon>
                </div>
                LMS <span>Admin</span>
            </div>
            
            <div class="header">
                <h2>Welcome Back!</h2>
                <p>Log in to manage courses, students, and partners.</p>
            </div>

            <!-- Email & Password Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="••••••••••••••••">
                        <ion-icon name="eye-outline"></ion-icon>
                    </div>
                </div>

                <div class="form-actions">
                    <label><input type="checkbox"> Keep me signed in</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <!-- OTP Form (Hidden initially) -->
            <form id="otpForm" style="display: none;">
                <div class="input-group">
                    <label>Enter 6-digit OTP</label>
                    <input type="text" id="otp" required placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 4px; font-size: 18px;">
                </div>
                <button type="submit" class="btn-primary">Verify & Login</button>
            </form>

        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <h1 class="hero-text">Manage your entire<br>educational ecosystem<br>from one dashboard.</h1>
            
            <div class="mockup">
                <div class="mockup-header">
                    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
                </div>
                <div class="mockup-sidebar"></div>
                <div class="mockup-main">
                    <div class="mockup-block"></div>
                    <div class="mockup-block"></div>
                    <div class="mockup-block" style="opacity: 0.5;"></div>
                </div>
                
                <!-- Floating Card Mockup -->
                <div class="mockup-card">
                    <div class="avatar" style="background: #e0e7ff; color: #4f5be8; display: flex; justify-content: center; align-items: center; font-weight: bold;">PP</div>
                    <div class="info">
                        <h4>Priya Patel</h4>
                        <p>Advanced React Native</p>
                        <div style="display: flex; gap: 16px; margin-top: 8px;">
                            <div><p style="font-size: 8px; font-weight: bold;">Status</p><p>Active</p></div>
                            <div><p style="font-size: 8px; font-weight: bold;">Progress</p><p>85%</p></div>
                        </div>
                    </div>
                    <button class="card-btn">View Profile</button>
                </div>
            </div>

            <div class="footer-links">
                <span>@2026 All Rights Reserved LMS</span>
                <span>Privacy Policy and Terms of Use</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (data.success) {
                    // Hide password form, show OTP form
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    alert('OTP has been sent to your email (Mock OTP: 123456)');
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Connection error');
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otp').value;
            
            try {
                const res = await fetch('/api/admin/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Verification error');
            }
        });
    </script>
</body>
</html>
