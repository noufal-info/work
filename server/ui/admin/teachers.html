<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Admin Dashboard</title>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        // Basic Route Protection
        if (localStorage.getItem('adminAuth') !== 'true') {
            window.location.href = '/AnalogiX/admin/login';
        }
    </script>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            
            <div class="logo" style="margin-bottom: 24px; display: flex; justify-content: center; width: 100%;">
                <img src="/user/logo/AnalogiX.png" alt="AnalogiX Logo" style="height: 32px; max-width: 100%; object-fit: contain;">
            </div>

            
            <nav class="sidebar-nav">
                <a href="/AnalogiX/admin" class="nav-item" id="nav-dashboard">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Dashboard</span>
                </a>
                <a href="/AnalogiX/admin/teachers" class="nav-item active" id="nav-teachers">
                    <ion-icon name="school-outline"></ion-icon>
                    <span>Teachers</span>
                </a>
                
                <a href="/AnalogiX/admin/courses" class="nav-item" id="nav-courses">
                    <ion-icon name="library-outline"></ion-icon>
                    <span>Courses</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Search students, courses, batches...">
                </div>
                
                <div class="header-actions">
                    <button class="icon-btn">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">5</span>
                    </button>
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Main+Admin&background=10b981&color=fff" alt="Admin Avatar">
                        <div class="profile-info">
                            <span class="name">Super Admin</span>
                            <span class="role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Teachers Content -->
            <div id="section-teachers" class="content-section dashboard-content" >
                <div class="page-header">
                    <h1>Teacher Management</h1>
                    <button class="btn-primary" onclick="openModal('teacherModal')">
                        <ion-icon name="add-outline"></ion-icon>
                        Create New Teacher
                    </button>
                </div>
                <div class="data-section">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Teacher Name</th>
                                    <th>Email</th>
                                    <th>Courses Assigned</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="teachersTableBody">
                                <!-- Teachers will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Teacher Modal -->
            <div class="modal-overlay" id="teacherModal">
                <div class="modal">
                    <div class="modal-header">
                        <h2>Create New Teacher</h2>
                        <button class="modal-close" onclick="closeModal('teacherModal')"><ion-icon name="close-outline"></ion-icon></button>
                    </div>
                    <form onsubmit="handleTeacherSubmit(event)">
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="teacherName" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="teacherEmail" placeholder="e.g. john@example.com" required>
                            </div>

                            <div class="form-group">
                                <label>Temporary Password</label>
                                <input type="password" id="teacherPassword" placeholder="Minimum 8 characters" required minlength="8">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn-secondary" onclick="closeModal('teacherModal')">Cancel</button>
                            <button type="submit" class="btn-primary">Create Teacher</button>
                        </div>
                    </form>
                </div>
            </div>

            </main>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function handleTeacherSubmit(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Creating...';
            btn.disabled = true;

            const name = document.getElementById('teacherName').value;
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;

            try {
                const response = await fetch('/api/admin/teachers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, course: '', password })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert("Success! Teacher account created and saved to database.");
                    closeModal('teacherModal');
                    e.target.reset();
                    loadTeachers();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Failed to connect to the server.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loadTeachers() {
            const tbody = document.getElementById('teachersTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading teachers...</td></tr>';
            
            try {
                const response = await fetch('/api/admin/teachers');
                const teachers = await response.json();
                
                if (teachers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No teachers found. Click "Create New Teacher" to add one.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                teachers.forEach(teacher => {
                    const initials = teacher.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="user-cell">
                                <div class="avatar-small blue-bg">${initials}</div>
                                <span>${teacher.name}</span>
                            </div>
                        </td>
                        <td>${teacher.email}</td>
                        <td>${teacher.course || 'Unassigned'}</td>
                        <td><span class="status-badge ${teacher.status === 'Active' ? 'active' : ''}">${teacher.status || 'Active'}</span></td>
                        <td>
                            <button class="btn-secondary" style="padding: 4px 10px; font-size: 11px; white-space: nowrap;" onclick="impersonateTeacher(${teacher.id})">
                                <ion-icon name="log-in-outline" style="margin-right: 4px;"></ion-icon> Super Access
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">Error loading teachers.</td></tr>';
            }
        }

        // Load teachers when page loads
        document.addEventListener('DOMContentLoaded', loadTeachers);
        
        async function impersonateTeacher(id) {
            try {
                const res = await fetch('/api/admin/teachers/impersonate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                
                if (data.success && data.teacher) {
                    // Set teacher auth token and credentials for teacher dashboard
                    localStorage.setItem('teacherAuth', 'true');
                    localStorage.setItem('teacherEmail', data.teacher.email);
                    localStorage.setItem('teacherName', data.teacher.name);
                    localStorage.setItem('currentTeacherId', data.teacher.id);
                    localStorage.setItem('currentTeacherName', data.teacher.name);
                    localStorage.setItem('superAdminImpersonating', 'true');
                    
                    // Direct navigation ensures reliable redirection without popup blocker issues
                    window.location.href = '/AnalogiX/teacher?impersonate=' + encodeURIComponent(data.teacher.email);
                } else {
                    alert("Error: " + (data.message || 'Unable to access teacher account.'));
                }
            } catch (err) {
                alert("Failed to connect to the server.");
            }
        }
        // Extra Javascript logic will be added here as needed

        // Logout functionality
        document.querySelector('.logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminAuth');
            window.location.href = '/AnalogiX/admin/login';
        });
    </script>
</body>
</html>
