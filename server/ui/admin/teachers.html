<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Admin Dashboard</title>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        // Basic Route Protection
        if (localStorage.getItem('adminAuth') !== 'true') {
            window.location.href = '/AnalogiX/admin/login';
        }
    </script>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <ion-icon name="shield"></ion-icon>
                </div>
                <span>Main Admin</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/AnalogiX/admin" class="nav-item" id="nav-dashboard">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Dashboard</span>
                </a>
                <a href="/AnalogiX/admin/teachers" class="nav-item active" id="nav-teachers">
                    <ion-icon name="school-outline"></ion-icon>
                    <span>Teachers</span>
                </a>
                
                <a href="/AnalogiX/admin/courses" class="nav-item" id="nav-courses">
                    <ion-icon name="library-outline"></ion-icon>
                    <span>Courses</span>
                </a>
                <a href="/AnalogiX/admin/calendar" class="nav-item" id="nav-calendar">
                    <ion-icon name="calendar-outline"></ion-icon>
                    <span>Calendar & Meets</span>
                </a>
                <a href="/AnalogiX/admin/messages" class="nav-item" id="nav-messages">
                    <ion-icon name="chatbubbles-outline"></ion-icon>
                    <span>Communications</span>
                </a>
                <a href="/AnalogiX/admin/reports" class="nav-item" id="nav-reports">
                    <ion-icon name="bar-chart-outline"></ion-icon>
                    <span>Reports</span>
                </a>
                <a href="/AnalogiX/admin/settings" class="nav-item" id="nav-settings">
                    <ion-icon name="settings-outline"></ion-icon>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Search students, courses, batches...">
                </div>
                
                <div class="header-actions">
                    <button class="icon-btn">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">5</span>
                    </button>
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Main+Admin&background=10b981&color=fff" alt="Admin Avatar">
                        <div class="profile-info">
                            <span class="name">Super Admin</span>
                            <span class="role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Teachers Content -->
            <div id="section-teachers" class="content-section dashboard-content" >
                <div class="page-header">
                    <h1>Teacher Management</h1>
                    <button class="btn-primary" onclick="openModal('teacherModal')">
                        <ion-icon name="add-outline"></ion-icon>
                        Create New Teacher
                    </button>
                </div>
                <div class="data-section">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Teacher Name</th>
                                    <th>Email</th>
                                    <th>Courses Assigned</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <div class="user-cell">
                                            <div class="avatar-small blue-bg">JS</div>
                                            <span>John Smith</span>
                                        </div>
                                    </td>
                                    <td>john.smith@example.com</td>
                                    <td>3 Courses</td>
                                    <td><span class="status-badge active">Active</span></td>
                                    <td>
                                        <button class="icon-btn small"><ion-icon name="create-outline"></ion-icon></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Teacher Modal -->
            <div class="modal-overlay" id="teacherModal">
                <div class="modal">
                    <div class="modal-header">
                        <h2>Create New Teacher</h2>
                        <button class="modal-close" onclick="closeModal('teacherModal')"><ion-icon name="close-outline"></ion-icon></button>
                    </div>
                    <form onsubmit="handleTeacherSubmit(event)">
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="teacherName" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="teacherEmail" placeholder="e.g. john@example.com" required>
                            </div>
                            <div class="form-group">
                                <label>Assign Course (Optional)</label>
                                <select id="teacherCourse">
                                    <option value="">None</option>
                                    <option value="node">Advanced Node.js</option>
                                    <option value="react">React Native Basics</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Temporary Password</label>
                                <input type="password" id="teacherPassword" placeholder="Minimum 8 characters" required minlength="8">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn-secondary" onclick="closeModal('teacherModal')">Cancel</button>
                            <button type="submit" class="btn-primary">Create Teacher</button>
                        </div>
                    </form>
                </div>
            </div>

            </main>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function handleTeacherSubmit(e) {
            e.preventDefault();
            // In a real app, you'd send this data to your backend API
            alert("Success! Teacher account created and email invitation sent.");
            closeModal('teacherModal');
            
            // Optionally, refresh or dynamically add the new row to the table here
        }
        // Extra Javascript logic will be added here as needed

        // Logout functionality
        document.querySelector('.logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminAuth');
            window.location.href = '/AnalogiX/admin/login';
        });
    </script>
</body>
</html>
