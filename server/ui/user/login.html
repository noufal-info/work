<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LMS - Student Login</title>
    <link rel="stylesheet" href="/user/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-color);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-logo {
            height: 120px;
            margin-bottom: 24px;
            animation: fadeIn 1s ease-in-out;
        }
        .splash-text {
            font-size: 20px;
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .splash-partners {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            animation: fadeIn 2s ease-in-out;
        }
        .splash-partners img {
            height: 40px;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.7;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 24px;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--blue-light);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--green-primary);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--green-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            margin-top: 10px;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .forgot-password {
            display: block;
            margin-top: 24px;
            color: var(--green-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .partner-section {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            font-family: 'Open Sans', sans-serif;
        }
        .partner-section h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .partner-logos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .partner-logos img {
            height: 35px;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        .partner-logos img:hover {
            filter: grayscale(0%);
            opacity: 1;
        }
        .main-logos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 10px;
        }
        .main-logos img {
            height: 50px;
            object-fit: contain;
        }
        .initiative-text {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <img src="/user/logo/semicon-keralam-logo (1).png" alt="AnalogiX Logo" class="splash-logo">
        <div class="splash-text">AnalogiX – Semiconductor Industry Competence Centre (SICC)</div>
        <div class="splash-partners">
            <img src="/user/logo/TECHNOPARK.png" alt="Technopark">
            <img src="/user/logo/digital university.png" alt="Digital University Kerala">
            <img src="/user/logo/space.png" alt="SPACE">
            <img src="/user/logo/iby infopark.svg" alt="i by Infopark">
            <img src="/user/logo/synopsys.png" alt="Synopsys">
            <img src="/user/logo/marvell.png" alt="Marvell">
            <img src="/user/logo/ivp.png" alt="IVP Semi">
            <img src="/user/logo/innatera.png" alt="Innatera">
            <img src="/user/logo/axiomise.png" alt="Axiomise">
            <img src="/user/logo/xtra g club.png" alt="X-tra G club">
        </div>
    </div>

    <div class="login-container">
        <img src="/user/logo/semicon-keralam-logo (1).png" alt="AnalogiX Logo" style="height: 80px; margin: 0 auto 24px; display: block;">
        <h1>Welcome Back</h1>
        <p>Login to continue your learning journey</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required value="student@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required value="password123">
            </div>
            
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>
        
        <a href="#" class="forgot-password">Forgot Password?</a>
    </div>

    <div class="partner-section">
        <div class="main-logos">
            <img src="/user/logo/semicon-keralam-logo (1).png" alt="Semicon Keralam" style="height: 60px;">
            <img src="/user/logo/TECHNOPARK.png" alt="Technopark">
            <img src="/user/logo/digital university.png" alt="Digital University Kerala">
            <img src="/user/logo/space.png" alt="SPACE">
            <img src="/user/logo/iby infopark.svg" alt="i by Infopark">
        </div>
        <div class="initiative-text">AnalogiX – Semiconductor Industry Competence Centre (SICC)</div>
        <h3>Proposed Industry Partners</h3>
        <div class="partner-logos">
            <img src="/user/logo/synopsys.png" alt="Synopsys" title="EDA">
            <img src="/user/logo/marvell.png" alt="Marvell" title="Analog">
            <img src="/user/logo/ivp.png" alt="IVP Semi" title="Power">
            <img src="/user/logo/innatera.png" alt="Innatera" title="Neuromorphic">
            <img src="/user/logo/axiomise.png" alt="Axiomise" title="Verification">
            <img src="/user/logo/xtra g club.png" alt="X-tra G club" title="Learning Platform">
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 2500);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Login successful!');
                    window.location.href = '/';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Error logging in');
            }
        });
    </script>
</body>
</html>
