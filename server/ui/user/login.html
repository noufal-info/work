<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LMS - Student Login</title>
    <link rel="stylesheet" href="/user/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-color);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .analogix-title {
            font-size: 48px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            animation: fadeIn 1s ease-in-out;
        }
        .powered-by {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            animation: fadeIn 1.2s ease-in-out;
        }
        .powered-by span {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .powered-logo {
            height: 45px;
        }
        .splash-text {
            font-size: 16px;
            color: #4b5563;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .partner-categories {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
            max-width: 900px;
            animation: fadeIn 2s ease-in-out;
        }
        .partner-category {
            text-align: center;
        }
        .partner-category h4 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .splash-partners {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .partner-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .partner-role {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
        }
        .splash-partners img {
            height: 50px;
            object-fit: contain;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 24px;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--blue-light);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--green-primary);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--green-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            margin-top: 10px;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .forgot-password {
            display: block;
            margin-top: 24px;
            color: var(--green-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .partner-section {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            font-family: 'Open Sans', sans-serif;
        }
        .partner-section h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .partner-logos img {
            height: 50px;
            object-fit: contain;
            transition: all 0.3s ease;
        }
        .partner-logos img:hover {
            transform: scale(1.05);
        }
        .main-logos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 10px;
        }
        .main-logos img {
            height: 50px;
            object-fit: contain;
        }
        .initiative-text {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .analogix-title {
                font-size: 32px !important;
            }
            .powered-logo {
                height: 30px !important;
            }
            .splash-text, .initiative-text {
                font-size: 12px !important;
                padding: 0 10px;
            }
            .partner-categories {
                gap: 24px !important;
                margin-top: 20px !important;
            }
            .splash-partners {
                gap: 15px !important;
            }
            .splash-partners img {
                height: auto !important;
                max-height: 35px !important;
                max-width: 85px !important;
            }
            .partner-role {
                font-size: 9px !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/user/logo/AnalogiX.png" alt="AnalogiX Logo" style="height: 80px; margin: 0 auto 24px; display: block;">
        <h1>Welcome Back</h1>
        <p>Login to continue your learning journey</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required value="student@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required value="password123">
            </div>
            
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>
        
        <a href="#" class="forgot-password">Forgot Password?</a>
    </div>

    <div class="partner-section">
        <img src="/user/logo/AnalogiX.png" alt="AnalogiX" style="height: 60px; margin-bottom: 10px;">
        <div class="initiative-text">Semiconductor Industry Competence Centre (SICC)</div>
        
        <div class="splash-partners" style="margin-top: 15px; margin-bottom: 30px;">
            <div class="partner-item">
                <span class="partner-role">Learning Platform</span>
                <img src="/user/logo/xtra g club.png" alt="X-tra G club">
            </div>
        </div>

        <div class="partner-categories" style="margin-top: 20px;">
            <div class="partner-category">
                <h4>Partners:</h4>
                <div class="splash-partners">
                    <div class="partner-item"><img src="/user/logo/semicon-keralam-logo (1).png" alt="Semicon Keralam"></div>
                    <div class="partner-item"><img src="/user/logo/TECHNOPARK.png" alt="Technopark"></div>
                    <div class="partner-item"><img src="/user/logo/iby infopark.svg" alt="i by Infopark"></div>
                    <div class="partner-item"><img src="/user/logo/digital university.png" alt="Digital University Kerala"></div>
                    <div class="partner-item"><img src="/user/logo/space.png" alt="SPACE"></div>
                </div>
            </div>
            <div class="partner-category">
                <h4>Industry Partners</h4>
                <div class="splash-partners">
                    <div class="partner-item"><span class="partner-role">EDA</span><img src="/user/logo/synopsys.png" alt="Synopsys"></div>
                    <div class="partner-item"><span class="partner-role">Analog</span><img src="/user/logo/marvell.png" alt="Marvell"></div>
                    <div class="partner-item"><span class="partner-role">Power</span><img src="/user/logo/ivp.png" alt="IVP Semi"></div>
                    <div class="partner-item"><span class="partner-role">Neuromorphic</span><img src="/user/logo/innatera.png" alt="Innatera"></div>
                    <div class="partner-item"><span class="partner-role">Verification</span><img src="/user/logo/axiomise.png" alt="Axiomise"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Login successful!');
                    window.location.href = '/';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Error logging in');
            }
        });
    </script>
</body>
</html>
