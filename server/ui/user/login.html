<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LMS - Student Login</title>
    <link rel="stylesheet" href="/user/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-color);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .analogix-title {
            font-size: 48px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            animation: fadeIn 1s ease-in-out;
        }
        .powered-by {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            animation: fadeIn 1.2s ease-in-out;
        }
        .powered-by span {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .powered-logo {
            height: 45px;
        }
        .splash-text {
            font-size: 16px;
            color: #4b5563;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .partner-categories {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
            max-width: 900px;
            animation: fadeIn 2s ease-in-out;
        }
        .partner-category {
            text-align: center;
        }
        .partner-category h4 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .splash-partners {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .partner-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .partner-role {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
        }
        .splash-partners img {
            height: 50px;
            object-fit: contain;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 24px;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--blue-light);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--green-primary);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--green-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            margin-top: 10px;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .forgot-password {
            display: block;
            margin-top: 24px;
            color: var(--green-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .partner-section {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            font-family: 'Open Sans', sans-serif;
        }
        .partner-section h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .partner-logos img {
            height: 50px;
            object-fit: contain;
            transition: all 0.3s ease;
        }
        .partner-logos img:hover {
            transform: scale(1.05);
        }
        .main-logos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 10px;
        }
        .main-logos img {
            height: 50px;
            object-fit: contain;
        }
        .initiative-text {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .analogix-title {
                font-size: 32px !important;
            }
            .powered-logo {
                height: 30px !important;
            }
            .splash-text, .initiative-text {
                font-size: 12px !important;
                padding: 0 10px;
            }
            .partner-categories {
                gap: 24px !important;
                margin-top: 20px !important;
            }
            .splash-partners {
                gap: 15px !important;
            }
            .splash-partners img {
                height: auto !important;
                max-height: 35px !important;
                max-width: 85px !important;
            }
            .partner-role {
                font-size: 9px !important;
            }
        }

        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffffff;
            z-index: 9999;
            padding: 2vh 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .splash-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            background: #ffffff;
            padding: 2vh 20px;
        }
        .splash-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .analogix-main-logo { height: clamp(50px, 8vh, 90px); margin: 0 auto 1vh; display: block; }
        .sicc-title { font-size: clamp(16px, 4vw, 24px); font-weight: 800; color: #0f172a; margin-bottom: 0.5vh; letter-spacing: -0.5px; }
        .initiative-text { font-size: clamp(11px, 2.5vw, 15px); font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        
        .splash-section { width: 100%; }
        .splash-section h3 {
            font-size: clamp(16px, 3.5vw, 28px); color: #0f172a; font-weight: 700; margin-bottom: 1vh; text-align: center;
        }
        .title-underline {
            width: 50px;
            height: 3px;
            background-color: #f97316;
            margin: 0 auto 2.5vh;
        }
        .partners-row {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(15px, 3vw, 50px);
        }
        .partners-row img { height: clamp(30px, 6vh, 55px); object-fit: contain; }

        .clean-logo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2vh 2vw;
            align-items: center;
            justify-items: center;
        }
        .clean-logo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1vw;
            width: 100%;
        }
        .clean-logo-item img {
            height: clamp(25px, 5vh, 50px);
            object-fit: contain;
            max-width: clamp(80px, 15vw, 150px);
        }
        .vertical-divider {
            height: clamp(20px, 4vh, 40px);
            width: 1px;
            background-color: #cbd5e1;
        }
        .logo-role {
            font-size: clamp(10px, 2.5vw, 15px);
            color: #475569;
            font-weight: 500;
        }
        
        .btn-continue {
            background: transparent;
            color: #4f5be8;
            border: 2px solid #4f5be8;
            padding: clamp(10px, 2vh, 14px) clamp(20px, 4vw, 40px);
            border-radius: 30px;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 auto;
            display: block;
        }
        .btn-continue:hover { background: #4f5be8; color: white; transform: translateY(-2px); }

        @media (max-width: 900px) {
            .clean-logo-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5vh 2vw; }
            .clean-logo-item { gap: 8px; }
        }
        @media (max-width: 600px) {
            .splash-screen { padding: 1vh 10px; }
            .analogix-main-logo { height: 7vh; }
            .clean-logo-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5vh 1vw; }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-container">
            <div class="splash-header">
                <img src="/user/logo/AnalogiX.png" alt="AnalogiX Logo" class="analogix-main-logo">
                <h2 class="sicc-title">Semiconductor Industry Competence Centre (SICC)</h2>
                <p class="initiative-text">A Flagship Initiative under Semicon Keralam</p>
            </div>

            <div class="splash-section">
                <h3>Our Partners</h3>
                <div class="title-underline"></div>
                <div class="partners-row">
                    <img src="/user/logo/semicon-keralam-logo (1).png" alt="Semicon Keralam">
                    <img src="/user/logo/iby infopark.svg" alt="i by Infopark">
                    <img src="/user/logo/TECHNOPARK.png" alt="Technopark">
                    <img src="/user/logo/digital university.png" alt="Digital University Kerala">
                    <img src="/user/logo/space.png" alt="SPACE">
                </div>
            </div>

            <div class="splash-section">
                <h3>Proposed Industry Partners</h3>
                <div class="title-underline"></div>
                <div class="clean-logo-grid">
                    <div class="clean-logo-item">
                        <img src="/user/logo/synopsys.png" alt="Synopsys">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">EDA</span>
                    </div>
                    <div class="clean-logo-item">
                        <img src="/user/logo/marvell.png" alt="Marvell">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">Analog</span>
                    </div>
                    <div class="clean-logo-item">
                        <img src="/user/logo/ivp.png" alt="IVP Semi">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">Power</span>
                    </div>
                    <div class="clean-logo-item">
                        <img src="/user/logo/innatera.png" alt="Innatera">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">Neuromorphic</span>
                    </div>
                    <div class="clean-logo-item">
                        <img src="/user/logo/axiomise.png" alt="Axiomise">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">Verification</span>
                    </div>
                    <div class="clean-logo-item">
                        <img src="/user/logo/xtra g club.png" alt="X-tra G club" style="height: 65px;">
                        <div class="vertical-divider"></div>
                        <span class="logo-role">Learning Platform</span>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <div class="login-container">
        <img src="/user/logo/AnalogiX.png" alt="AnalogiX Logo" style="height: 80px; margin: 0 auto 24px; display: block;">
        <h1>Welcome Back</h1>
        <p>Login to continue your learning journey</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required value="student@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required value="password123">
            </div>
            
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>
        
        <a href="#" class="forgot-password">Forgot Password?</a>
    </div>



    <script>
        // Auto-hide splash screen after 4 seconds
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 500);
            }
        }, 4000);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('studentAuth', 'true');
                    localStorage.setItem('studentEmail', email);
                    localStorage.setItem('studentName', data.user.name);
                    window.location.href = '/AnalogiX/user';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Error logging in');
            }
        });
    </script>
</body>
</html>
