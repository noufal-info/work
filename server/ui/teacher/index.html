<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Teacher Dashboard</title>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        // Basic Route Protection
        if (localStorage.getItem('teacherAuth') !== 'true') {
            window.location.href = '/AnalogiX/teacher/login';
        }
    </script>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            
            <div class="logo" style="margin-bottom: 24px; display: flex; justify-content: center; width: 100%;">
                <img src="/user/logo/AnalogiX.png" alt="AnalogiX Logo" style="height: 32px; max-width: 100%; object-fit: contain;">
            </div>

            
            
            <nav class="sidebar-nav">
                <a href="/AnalogiX/teacher" class="nav-item active" id="nav-courses">
                    <ion-icon name="library-outline"></ion-icon>
                    <span>My Courses</span>
                </a>
                <a href="#" class="nav-item" id="nav-messages">
                    <ion-icon name="chatbubbles-outline"></ion-icon>
                    <span>Communications</span>
                </a>
                <a href="#" class="nav-item" id="nav-settings">
                    <ion-icon name="settings-outline"></ion-icon>
                    <span>Settings</span>
                </a>
            </nav>

            
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Search students, courses, batches...">
                </div>
                
                <div class="header-actions">
                    <button class="icon-btn">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">5</span>
                    </button>
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Main+Admin&background=10b981&color=fff" alt="Admin Avatar">
                        <div class="profile-info">
                            <span class="name">Instructor</span>
                            <span class="role">Teacher</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Courses Content -->
            <div id="section-courses" class="content-section dashboard-content" >
                <div class="page-header">
                    <h1>Courses Management</h1>
                    <button class="btn-primary" onclick="openModal('courseModal')">
                        <ion-icon name="add-outline"></ion-icon>
                        Create New Course
                    </button>
                </div>
                <div class="data-section" style="margin-top: 2rem;">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Course Name</th>
                                    <th>Enrolled</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="coursesTableBody">
                                <!-- Courses will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="data-section" style="margin-top: 2rem;" id="pendingApprovalsSection">
                    <div class="page-header" style="margin-bottom: 1rem;">
                        <h2>Pending Approvals</h2>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Student Email</th>
                                    <th>Course Requested</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="pendingTableBody">
                                <!-- Pending requests will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Course Modal -->
            <div class="modal-overlay" id="courseModal">
                <div class="modal">
                    <div class="modal-header">
                        <h2>Create New Course</h2>
                        <button class="modal-close" onclick="closeModal('courseModal')"><ion-icon name="close-outline"></ion-icon></button>
                    </div>
                    <form onsubmit="handleCourseSubmit(event)">
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Course Title</label>
                                <input type="text" id="courseTitle" placeholder="e.g. Python for Beginners" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="courseDescription" rows="3" placeholder="Brief description of the course..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Assign Instructor</label>
                                <select id="courseInstructor">
                                    <option value="john">John Smith</option>
                                    <option value="other">Unassigned</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (₹)</label>
                                <input type="number" id="coursePrice" placeholder="e.g. 1999" required min="0">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn-secondary" onclick="closeModal('courseModal')">Cancel</button>
                            <button type="submit" class="btn-primary">Publish Course</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Enroll Student Modal -->
            <div class="modal-overlay" id="enrollModal">
                <div class="modal">
                    <div class="modal-header">
                        <h2>Enroll Student</h2>
                        <button class="modal-close" onclick="closeModal('enrollModal')"><ion-icon name="close-outline"></ion-icon></button>
                    </div>
                    <form onsubmit="handleEnrollSubmit(event)">
                        <div class="modal-body">
                            <input type="hidden" id="enrollCourseId">
                            <div class="form-group">
                                <label>Student Email Address</label>
                                <input type="email" id="enrollStudentEmail" placeholder="student@example.com" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn-secondary" onclick="closeModal('enrollModal')">Cancel</button>
                            <button type="submit" class="btn-primary">Add Student</button>
                        </div>
                    </form>
                </div>
            </div>

            </main>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function handleCourseSubmit(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Publishing...';
            btn.disabled = true;

            const title = document.getElementById('courseTitle').value;
            const description = document.getElementById('courseDescription').value;
            const instructor = document.getElementById('courseInstructor').options[document.getElementById('courseInstructor').selectedIndex].text;
            const price = document.getElementById('coursePrice').value;

            try {
                const response = await fetch('/api/teacher/courses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, instructor, price })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert("Success! The new course has been created and published.");
                    closeModal('courseModal');
                    e.target.reset();
                    loadCourses();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Failed to connect to the server.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loadCourses() {
            const tbody = document.getElementById('coursesTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Loading courses...</td></tr>';
            
            try {
                const response = await fetch('/api/teacher/courses');
                const courses = await response.json();
                
                if (courses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No courses found. Click "Create New Course" to publish one.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                courses.forEach(course => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <strong>${course.title}</strong><br>
                            <small style="color:var(--text-muted)">Instructor: ${course.instructor}</small>
                        </td>
                        <td>${course.enrolled_count || 0} Students (₹${course.price})</td>
                        <td><span class="status-badge ${course.status === 'Published' ? 'active' : ''}">${course.status || 'Published'}</span></td>
                        <td>
                            <button class="icon-btn small" onclick="openEnrollModal(${course.id})" title="Add Student"><ion-icon name="person-add-outline"></ion-icon></button>
                            <button class="icon-btn small" title="Edit Course"><ion-icon name="create-outline"></ion-icon></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Error loading courses.</td></tr>';
            }
        }

        // Load courses when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadCourses();
            loadPendingApprovals();
        });

        async function loadPendingApprovals() {
            const tbody = document.getElementById('pendingTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Loading requests...</td></tr>';
            
            try {
                const response = await fetch('/api/teacher/enrollments/pending');
                const pending = await response.json();
                
                if (pending.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No pending enrollment requests.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                pending.forEach(req => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${req.student_email}</td>
                        <td><strong>${req.course_title}</strong></td>
                        <td>${new Date(req.enrolled_at).toLocaleDateString()}</td>
                        <td>
                            <button class="btn-primary" style="padding: 4px 10px; font-size: 11px;" onclick="handleApproval(${req.enrollment_id}, 'accept')">Accept</button>
                            <button class="btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="handleApproval(${req.enrollment_id}, 'reject')">Reject</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Error loading pending requests.</td></tr>';
            }
        }

        async function handleApproval(enrollment_id, action) {
            try {
                const res = await fetch('/api/teacher/enrollments/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enrollment_id, action })
                });
                const data = await res.json();
                
                if (data.success) {
                    loadPendingApprovals();
                    loadCourses(); // update enrolled count
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Failed to connect to the server.");
            }
        }


        function openEnrollModal(courseId) {
            document.getElementById('enrollCourseId').value = courseId;
            openModal('enrollModal');
        }

        async function handleEnrollSubmit(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Adding...';
            btn.disabled = true;

            const course_id = document.getElementById('enrollCourseId').value;
            const student_email = document.getElementById('enrollStudentEmail').value;

            try {
                const response = await fetch('/api/teacher/students/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ course_id, student_email })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert("Success! Student has been enrolled.");
                    closeModal('enrollModal');
                    e.target.reset();
                    loadCourses(); // Refresh list to update count
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Failed to connect to the server.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Extra Javascript logic will be added here as needed

        // Logout functionality
        document.querySelector('.logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('teacherAuth');
            window.location.href = '/AnalogiX/teacher/login';
        });
    </script>
</body>
</html>
