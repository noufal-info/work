<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner LMS Login</title>
    <!-- Open Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { 
            background-color: #f4f6f9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #4f5be8; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #4f5be8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #3f4ac8; }
        .error { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }
        
        .analogix-title {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .powered-by {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .powered-by span {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .powered-logo {
            height: 45px;
        }
        .partner-section {
            width: 100%;
            text-align: center;
            margin-top: 60px;
            font-family: 'Open Sans', sans-serif;
        }
        .partner-categories {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
            max-width: 900px;
            margin: 40px auto 0;
        }
        .partner-category {
            text-align: center;
        }
        .partner-category h4 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .splash-partners {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .partner-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .partner-role {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
        }
        .splash-partners img {
            height: 50px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .splash-partners img:hover {
            transform: scale(1.05);
        }
        .initiative-text {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .analogix-title {
                font-size: 32px !important;
            }
            .powered-logo {
                height: 30px !important;
            }
            .splash-text, .initiative-text {
                font-size: 12px !important;
                padding: 0 10px;
            }
            .partner-categories {
                gap: 24px !important;
                margin-top: 20px !important;
            }
            .splash-partners {
                gap: 15px !important;
            }
            .splash-partners img {
                height: auto !important;
                max-height: 35px !important;
                max-width: 85px !important;
            }
            .partner-role {
                font-size: 9px !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">Partner Portal</div>
        <div class="subtitle">Log in to manage your LMS</div>
        
        <form id="partnerLoginForm">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" required placeholder="admin@partner.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div id="errorMessage" class="error">Invalid credentials</div>
        </form>
    </div>

    <div class="partner-section">
        <img src="/user/logo/AnalogiX.png" alt="AnalogiX" style="height: 60px; margin-bottom: 10px;">
        <div class="initiative-text">Semiconductor Industry Competence Centre (SICC)</div>
        
        <div class="splash-partners" style="margin-top: 15px; margin-bottom: 30px;">
            <div class="partner-item">
                <span class="partner-role">Learning Platform</span>
                <img src="/user/logo/xtra g club.png" alt="X-tra G club">
            </div>
        </div>

        <div class="partner-categories">
            <div class="partner-category">
                <h4>Partners:</h4>
                <div class="splash-partners">
                    <div class="partner-item"><img src="/user/logo/semicon-keralam-logo (1).png" alt="Semicon Keralam"></div>
                    <div class="partner-item"><img src="/user/logo/TECHNOPARK.png" alt="Technopark"></div>
                    <div class="partner-item"><img src="/user/logo/iby infopark.svg" alt="i by Infopark"></div>
                    <div class="partner-item"><img src="/user/logo/digital university.png" alt="Digital University Kerala"></div>
                    <div class="partner-item"><img src="/user/logo/space.png" alt="SPACE"></div>
                </div>
            </div>
            <div class="partner-category">
                <h4>Industry Partners</h4>
                <div class="splash-partners">
                    <div class="partner-item"><span class="partner-role">EDA</span><img src="/user/logo/synopsys.png" alt="Synopsys"></div>
                    <div class="partner-item"><span class="partner-role">Analog</span><img src="/user/logo/marvell.png" alt="Marvell"></div>
                    <div class="partner-item"><span class="partner-role">Power</span><img src="/user/logo/ivp.png" alt="IVP Semi"></div>
                    <div class="partner-item"><span class="partner-role">Neuromorphic</span><img src="/user/logo/innatera.png" alt="Innatera"></div>
                    <div class="partner-item"><span class="partner-role">Verification</span><img src="/user/logo/axiomise.png" alt="Axiomise"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('partnerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/partner/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('partnerDomain', data.domain);
                    window.location.href = '/partner';
                } else {
                    const errEl = document.getElementById('errorMessage');
                    errEl.style.display = 'block';
                    errEl.textContent = data.message;
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
